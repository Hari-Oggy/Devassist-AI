[project]
name = "devassist-ai"
version = "3.0.0"
authors = [{ name = "Hareesh T", email = "hareesh9320@gmail.com" }]
description = "Autonomous code review and documentation agent powered by multi-LLM routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "python-multipart>=0.0.9",
    # Task queue
    "celery>=5.3.0",
    "redis>=5.0.0",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.19.0",
    "psycopg2-binary>=2.9.12",
    "alembic>=1.13.0",
    # Configuration / validation
    "pydantic==2.7.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv==1.0.1",
    # LLM providers
    "openai>=1.58.0",
    "anthropic>=0.25.0",
    "google-genai>=0.8.0",
    # GitHub / GitLab clients
    "PyGithub==2.3.0",
    "httpx>=0.27.0",
    # RAG — dense retrieval
    "faiss-cpu==1.8.0",
    "sentence-transformers>=2.2.0",
    # RAG — sparse retrieval
    "rank-bm25>=0.2.2",
    # RAG / LangChain utilities (text splitting only — minimal surface area)
    "langchain-text-splitters>=0.2.0",
    # Token counting
    "tiktoken==0.7.0",
    # HTTP
    "requests==2.32.0",
    # Resilience
    "tenacity>=8.2.0",
    # YAML (for .devassist.yml per-repo config)
    "pyyaml>=6.0.0",
    "pyngrok>=8.1.2",
]
